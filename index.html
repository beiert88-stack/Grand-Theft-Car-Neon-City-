<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>Neon City Mobile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{width:100%;height:100%;display:block}.panel{position:fixed;z-index:10;background:#05070bd9;border:1px solid #ffffff22;border-radius:13px;padding:9px 12px;backdrop-filter:blur(5px)}
#hud{top:10px;left:10px;line-height:1.55;font-size:13px}#char{top:88px;left:10px}#mission{top:10px;left:50%;transform:translateX(-50%);text-align:center;max-width:72%;font-size:13px}
#district{position:fixed;top:100px;right:10px;z-index:10;background:#0008;padding:6px 10px;border-radius:9px;font-size:12px}
#stick{position:fixed;left:16px;bottom:18px;width:148px;height:148px;border-radius:50%;background:#fff2;border:2px solid #fff5;z-index:20}
#knob{position:absolute;left:46px;top:46px;width:52px;height:52px;border-radius:50%;background:#fff9}
.btn{position:fixed;z-index:20;width:68px;height:68px;border-radius:50%;border:2px solid #fff5;background:#ffffff28;color:#fff;font-size:20px}
#shoot{right:18px;bottom:145px}#vehicle{right:102px;bottom:53px}#action{right:18px;bottom:53px}
#charBtn{right:102px;bottom:145px}#weapon{right:186px;bottom:53px}#reload{right:186px;bottom:145px}
#mini{position:fixed;right:12px;top:145px;z-index:10;width:130px;height:95px;border:1px solid #fff3;border-radius:10px;background:#0a0d12aa}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="panel">💵 $<span id="money">2500</span> · ❤️ <span id="hp">100</span><br>🔫 <span id="weaponName">Pistole</span> · <span id="ammo">12</span>/<span id="reserve">60</span><br>🚨 <span id="stars">0</span>/5</div>
<div id="char" class="panel">👤 <span id="character">Rico</span> · <span id="role">Fahrer</span></div>
<div id="mission" class="panel">MISSION 1<br>Kontakt aufsuchen</div>
<div id="district">Innenstadt</div>
<canvas id="mini"></canvas>
<div id="stick"><div id="knob"></div></div>
<button class="btn" id="shoot">🔫</button><button class="btn" id="vehicle">🚗</button><button class="btn" id="action">E</button>
<button class="btn" id="charBtn">👤</button><button class="btn" id="weapon">⚔</button><button class="btn" id="reload">↻</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body></html>
